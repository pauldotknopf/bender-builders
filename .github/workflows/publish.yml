name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: bash publish.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenderBuilders-${{ matrix.rid }}
          path: project/src/BenderBuilders.App/bin/Release/net10.0/${{ matrix.rid }}/publish/
          if-no-files-found: error
          retention-days: 14
